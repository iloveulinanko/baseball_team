<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>プロ野球Vロード - スカウト＆オーダー</title>
<style>
  * {
    box-sizing: border-box;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    background: rgba(0, 0, 0, 0.85);
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #d4af37;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .title {
    font-size: 1.1rem;
    font-weight: bold;
    color: #ffd700;
  }
  .money-box {
    background: #111;
    border: 2px solid #ffd700;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.95rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .money-amount {
    color: #00ffcc;
    font-size: 1.15rem;
  }
  .reset-btn {
    background: #444;
    color: #fff;
    border: 1px solid #777;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .reset-btn:active { background: #666; }

  /* タブナビゲーション */
  .nav-tabs {
    width: 100%;
    max-width: 960px;
    display: flex;
    background: rgba(0, 0, 0, 0.6);
    border-bottom: 2px solid #444;
  }
  .tab-btn {
    flex: 1;
    padding: 14px;
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    border-bottom: 4px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: #ffd700;
    border-bottom: 4px solid #ffd700;
    background: rgba(255, 215, 0, 0.1);
  }

  .main-container {
    width: 100%;
    max-width: 960px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .view-section {
    width: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .view-section.active {
    display: flex;
  }

  /* ガチャ画面 */
  .banner {
    width: 100%;
    background: radial-gradient(circle at center, #1e4d2b 0%, #0b2413 100%);
    border: 3px solid #ffd700;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
  }
  .banner h2 {
    margin: 0 0 8px 0;
    font-size: 1.4rem;
    color: #ffd700;
  }
  .banner-sub {
    font-size: 0.9rem;
    color: #ffeb3b;
    margin-bottom: 8px;
    font-weight: bold;
  }
  .rates {
    display: inline-flex;
    justify-content: center;
    gap: 14px;
    font-size: 0.85rem;
    background: rgba(0, 0, 0, 0.6);
    padding: 6px 14px;
    border-radius: 8px;
  }
  .rate-s { color: #ff66ff; font-weight: bold; }
  .rate-a { color: #ff4444; font-weight: bold; }
  .rate-b { color: #4da6ff; font-weight: bold; }

  .controls {
    display: flex;
    gap: 16px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }
  .gacha-btn {
    flex: 1;
    min-width: 200px;
    max-width: 280px;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    font-size: 1.15rem;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .gacha-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .gacha-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-single {
    background: linear-gradient(180deg, #3a7bd5, #00d2ff);
    border: 2px solid #b3e5fc;
  }
  .btn-multi {
    background: linear-gradient(180deg, #f12711, #f5af19);
    border: 2px solid #fff59d;
  }
  .cost-tag {
    font-size: 0.85rem;
    background: rgba(0,0,0,0.45);
    padding: 2px 10px;
    border-radius: 10px;
  }

  .result-area {
    width: 100%;
    min-height: 250px;
    background: rgba(0, 0, 0, 0.45);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .result-title {
    font-size: 1rem;
    margin-bottom: 12px;
    color: #ddd;
  }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    width: 100%;
  }
  .cards-grid.single-mode {
    grid-template-columns: 1fr;
    max-width: 170px;
  }
  @media (max-width: 650px) {
    .cards-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .card {
    background: #222;
    border-radius: 10px;
    padding: 10px 6px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    opacity: 0;
    transform: scale(0.6);
  }
  @keyframes popIn {
    to { opacity: 1; transform: scale(1); }
  }
  .guarantee-tag {
    position: absolute;
    top: 4px;
    right: 4px;
    background: #ffeb3b;
    color: #000;
    font-size: 0.65rem;
    font-weight: bold;
    padding: 1px 4px;
    border-radius: 4px;
  }

  .rank-S {
    background: linear-gradient(135deg, #ff00cc, #333399, #ffd700);
    border: 3px solid #ffd700;
    box-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
  }
  .rank-A {
    background: linear-gradient(135deg, #8e0e00, #1f1c18);
    border: 3px solid #ff4444;
    box-shadow: 0 0 8px rgba(255, 68, 68, 0.5);
  }
  .rank-B {
    background: linear-gradient(135deg, #1c3b57, #0f1c29);
    border: 2px solid #4da6ff;
  }

  .rank-badge {
    font-size: 1.4rem;
    font-weight: 900;
    margin-bottom: 2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  .rank-S .rank-badge { color: #ffd700; }
  .rank-A .rank-badge { color: #ff6666; }
  .rank-B .rank-badge { color: #66b3ff; }

  .pos-badge {
    display: inline-block;
    background: rgba(0,0,0,0.65);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .player-name {
    font-size: 0.95rem;
    font-weight: bold;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-stat {
    font-size: 0.8rem;
    background: rgba(0,0,0,0.5);
    padding: 3px;
    border-radius: 4px;
    color: #eee;
  }

  /* オーダー編成画面 */
  .order-header-bar {
    width: 100%;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid #ffd700;
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .team-power-box {
    font-size: 1.1rem;
    font-weight: bold;
  }
  .team-power-val {
    color: #00ffcc;
    font-size: 1.4rem;
    margin-left: 6px;
  }
  .auto-btn {
    background: linear-gradient(180deg, #28a745, #1e7e34);
    color: #fff;
    border: 1px solid #8fd19e;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .auto-btn:active { transform: translateY(2px); }

  .order-layout {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .order-layout { grid-template-columns: 1fr; }
  }

  .panel-box {
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid #555;
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .panel-title {
    font-size: 1rem;
    font-weight: bold;
    color: #ffd700;
    border-bottom: 1px solid #444;
    padding-bottom: 6px;
    margin-bottom: 4px;
  }

  .slot-row {
    display: flex;
    align-items: center;
    background: #1b2631;
    border: 2px solid #34495e;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    gap: 10px;
  }
  .slot-row:hover { background: #243342; }
  .slot-row.selected {
    border-color: #00ffcc;
    background: #1c3d3d;
    box-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
  }
  .slot-label {
    width: 68px;
    font-weight: bold;
    font-size: 0.85rem;
    background: #0f171e;
    padding: 4px 6px;
    border-radius: 6px;
    text-align: center;
    color: #bbb;
    flex-shrink: 0;
  }
  .slot-player-info {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    overflow: hidden;
  }
  .empty-slot {
    color: #777;
    font-size: 0.9rem;
  }
  .rank-pill {
    font-weight: 900;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 0.85rem;
    margin-right: 6px;
  }
  .pill-S { background: #ffd700; color: #000; }
  .pill-A { background: #ff4444; color: #fff; }
  .pill-B { background: #4da6ff; color: #000; }

  .remove-slot-btn {
    background: #552222;
    color: #ffaaaa;
    border: 1px solid #883333;
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 0.75rem;
    cursor: pointer;
    margin-left: 8px;
  }

  /* 控え選手リスト */
  .bench-filter-info {
    font-size: 0.85rem;
    color: #00ffcc;
    background: rgba(0, 255, 204, 0.1);
    padding: 6px 10px;
    border-radius: 6px;
  }
  .bench-list {
    max-height: 460px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bench-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #222;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .bench-item:hover {
    background: #333;
    border-color: #ffd700;
  }
  .bench-item.in-use {
    opacity: 0.45;
    border-style: dashed;
  }
  .bench-item.mismatch {
    opacity: 0.35;
  }
  .in-use-tag {
    font-size: 0.7rem;
    background: #555;
    color: #fff;
    padding: 2px 5px;
    border-radius: 4px;
    margin-left: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="title">⚾ プロ野球Vロード</div>
  <div class="money-box">
    <span>資金:</span>
    <span class="money-amount" id="moneyDisplay">10000</span>
    <button class="reset-btn" onclick="resetData()">リセット</button>
  </div>
</header>

<div class="nav-tabs">
  <button class="tab-btn active" id="tabGacha" onclick="switchTab('gacha')">スカウト (ガチャ)</button>
  <button class="tab-btn" id="tabOrder" onclick="switchTab('order')">オーダー編成 (<span id="orderFilledCount">0</span>/10)</button>
</div>

<div class="main-container">
  <!-- ガチャ画面 -->
  <div class="view-section active" id="viewGacha">
    <div class="banner">
      <h2>プロ野球ドラフトスカウト</h2>
      <div class="banner-sub">★ 10連スカウトは10人目Aランク以上確定！ ★</div>
      <div class="rates">
        <span class="rate-s">Sランク: 5%</span>
        <span class="rate-a">Aランク: 15%</span>
        <span class="rate-b">Bランク: 80%</span>
      </div>
    </div>

    <div class="controls">
      <button class="gacha-btn btn-single" id="btnSingle" onclick="pullGacha(1)">
        <span>1回スカウト</span>
        <span class="cost-tag">消費: 25</span>
      </button>
      <button class="gacha-btn btn-multi" id="btnMulti" onclick="pullGacha(10)">
        <span>10連スカウト</span>
        <span class="cost-tag">消費: 250 (A以上1枚確定)</span>
      </button>
    </div>

    <div class="result-area">
      <div class="result-title" id="resultTitle">スカウトボタンを押して選手を獲得しよう！</div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </div>

  <!-- オーダー編成画面 -->
  <div class="view-section" id="viewOrder">
    <div class="order-header-bar">
      <div class="team-power-box">
        チーム総合力:<span class="team-power-val" id="teamPower">0</span>
      </div>
      <button class="auto-btn" onclick="autoOrder()">最強オーダー自動編成</button>
    </div>

    <div class="order-layout">
      <!-- 左側：スタメン＋投手枠 -->
      <div class="panel-box">
        <div class="panel-title">現在のオーダー (枠をタップして選手を選択)</div>
        <div id="orderSlotsContainer"></div>
      </div>

      <!-- 右側：選手ボックス -->
      <div class="panel-box">
        <div class="panel-title">所持選手一覧 (<span id="totalBoxCount">0</span>人)</div>
        <div class="bench-filter-info" id="slotFilterInfo">左のオーダー枠を選択すると配置できます</div>
        <div class="bench-list" id="benchList"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const INITIAL_MONEY = 10000;
  const COST_SINGLE = 25;
  const COST_MULTI = 250;

  let money = INITIAL_MONEY;
  let inventory = [];

  // 全選手マスターデータ（全選手にS・A・Bランクが存在する）
  // ランク別能力値目安: S(88~96), A(76~83), B(62~69)
  const MASTER_PLAYERS = [
    { baseId: "p01", name: "大谷 翔平", pos: "投手", stats: { S: 96, A: 83, B: 69 } },
    { baseId: "p02", name: "山本 由伸", pos: "投手", stats: { S: 95, A: 82, B: 68 } },
    { baseId: "p03", name: "佐々木 朗希", pos: "投手", stats: { S: 94, A: 81, B: 67 } },
    { baseId: "p04", name: "宮城 大弥", pos: "投手", stats: { S: 91, A: 79, B: 65 } },
    { baseId: "p05", name: "今永 昇太", pos: "投手", stats: { S: 92, A: 80, B: 66 } },
    { baseId: "p06", name: "栗林 良吏", pos: "投手", stats: { S: 90, A: 78, B: 64 } },

    { baseId: "c01", name: "森 友哉", pos: "捕手", stats: { S: 91, A: 79, B: 65 } },
    { baseId: "c02", name: "甲斐 拓也", pos: "捕手", stats: { S: 89, A: 77, B: 63 } },
    { baseId: "c03", name: "坂倉 将吾", pos: "捕手", stats: { S: 90, A: 78, B: 64 } },

    { baseId: "1b01", name: "岡本 和真", pos: "一塁手", stats: { S: 94, A: 81, B: 67 } },
    { baseId: "1b02", name: "山川 穂高", pos: "一塁手", stats: { S: 92, A: 80, B: 66 } },
    { baseId: "1b03", name: "浅村 栄斗", pos: "一塁手", stats: { S: 91, A: 79, B: 65 } },

    { baseId: "2b01", name: "牧 秀悟", pos: "二塁手", stats: { S: 93, A: 81, B: 67 } },
    { baseId: "2b02", name: "中野 拓夢", pos: "二塁手", stats: { S: 90, A: 78, B: 64 } },
    { baseId: "2b03", name: "吉川 尚輝", pos: "二塁手", stats: { S: 89, A: 77, B: 63 } },

    { baseId: "3b01", name: "村上 宗隆", pos: "三塁手", stats: { S: 95, A: 82, B: 68 } },
    { baseId: "3b02", name: "佐藤 輝明", pos: "三塁手", stats: { S: 91, A: 79, B: 65 } },
    { baseId: "3b03", name: "宗 佑磨", pos: "三塁手", stats: { S: 89, A: 77, B: 63 } },

    { baseId: "ss01", name: "源田 壮亮", pos: "遊撃手", stats: { S: 91, A: 79, B: 65 } },
    { baseId: "ss02", name: "長岡 秀樹", pos: "遊撃手", stats: { S: 89, A: 77, B: 63 } },
    { baseId: "ss03", name: "紅林 弘太郎", pos: "遊撃手", stats: { S: 88, A: 76, B: 62 } },

    { baseId: "lf01", name: "近藤 健介", pos: "左翼手", stats: { S: 94, A: 82, B: 68 } },
    { baseId: "lf02", name: "吉田 正尚", pos: "左翼手", stats: { S: 95, A: 82, B: 68 } },
    { baseId: "lf03", name: "佐野 恵太", pos: "左翼手", stats: { S: 90, A: 78, B: 64 } },

    { baseId: "cf01", name: "柳田 悠岐", pos: "中堅手", stats: { S: 94, A: 81, B: 67 } },
    { baseId: "cf02", name: "周東 佑京", pos: "中堅手", stats: { S: 89, A: 77, B: 63 } },
    { baseId: "cf03", name: "塩見 泰隆", pos: "中堅手", stats: { S: 90, A: 78, B: 64 } },

    { baseId: "rf01", name: "万波 中正", pos: "右翼手", stats: { S: 92, A: 80, B: 66 } },
    { baseId: "rf02", name: "鈴木 誠也", pos: "右翼手", stats: { S: 94, A: 81, B: 67 } },
    { baseId: "rf03", name: "丸 佳浩", pos: "右翼手", stats: { S: 90, A: 78, B: 64 } }
  ];

  // オーダー枠定義 (野手8ポジション + DH(全野手可) + 先発投手1 = 計10枠)
  const ORDER_SLOTS = [
    { key: "C", label: "捕手", acceptPos: ["捕手"] },
    { key: "1B", label: "一塁手", acceptPos: ["一塁手"] },
    { key: "2B", label: "二塁手", acceptPos: ["二塁手"] },
    { key: "3B", label: "三塁手", acceptPos: ["三塁手"] },
    { key: "SS", label: "遊撃手", acceptPos: ["遊撃手"] },
    { key: "LF", label: "左翼手", acceptPos: ["左翼手"] },
    { key: "CF", label: "中堅手", acceptPos: ["中堅手"] },
    { key: "RF", label: "右翼手", acceptPos: ["右翼手"] },
    { key: "DH", label: "DH", acceptPos: ["捕手", "一塁手", "二塁手", "三塁手", "遊撃手", "左翼手", "中堅手", "右翼手"] },
    { key: "P", label: "先発投手", acceptPos: ["投手"] }
  ];

  // 各枠にセットされた選手ID (instanceId)
  let lineup = {
    C: null, "1B": null, "2B": null, "3B": null, SS: null,
    LF: null, CF: null, RF: null, DH: null, P: null
  };
  let selectedSlotKey = "C";

  // タブ切り替え
  function switchTab(tab) {
    document.getElementById('tabGacha').classList.toggle('active', tab === 'gacha');
    document.getElementById('tabOrder').classList.toggle('active', tab === 'order');
    document.getElementById('viewGacha').classList.toggle('active', tab === 'gacha');
    document.getElementById('viewOrder').classList.toggle('active', tab === 'order');
    if (tab === 'order') {
      renderOrderView();
    }
  }

  // ガチャ1回抽選 (isGuaranteedA: trueならA以上確定)
  function drawOne(isGuaranteedA = false) {
    const rand = Math.random() * 100;
    let rank = 'B';

    if (isGuaranteedA) {
      // A以上確定枠: Sは5%、残り95%はA
      if (rand < 5) {
        rank = 'S';
      } else {
        rank = 'A';
      }
    } else {
      // 通常枠: S 5%, A 15%, B 80%
      if (rand < 5) {
        rank = 'S';
      } else if (rand < 20) {
        rank = 'A';
      } else {
        rank = 'B';
      }
    }

    // 全選手からランダムに1人選び、該当ランクの能力値を適用
    const master = MASTER_PLAYERS[Math.floor(Math.random() * MASTER_PLAYERS.length)];
    return {
      instanceId: Date.now() + "_" + Math.random().toString(36).substr(2, 6),
      baseId: master.baseId,
      rank: rank,
      name: master.name,
      pos: master.pos,
      power: master.stats[rank],
      isGuaranteed: isGuaranteedA
    };
  }

  // ガチャ実行
  function pullGacha(times) {
    const cost = times === 10 ? COST_MULTI : COST_SINGLE;
    if (money < cost) return;

    money -= cost;
    const results = [];

    for (let i = 0; i < times; i++) {
      // 10連の最後（index === 9）はA以上確定
      const isGuaranteedA = (times === 10 && i === 9);
      const player = drawOne(isGuaranteedA);
      results.push(player);
      inventory.push(player);
    }

    renderGachaResults(results);
    updateHeaderUI();
  }

  // ガチャ結果表示
  function renderGachaResults(results) {
    const grid = document.getElementById('cardsGrid');
    const title = document.getElementById('resultTitle');
    grid.innerHTML = '';

    if (results.length === 1) {
      grid.classList.add('single-mode');
      title.textContent = 'スカウト結果 (1回)';
    } else {
      grid.classList.remove('single-mode');
      title.textContent = 'スカウト結果 (10連 - 10人目A以上確定)';
    }

    results.forEach((player, index) => {
      const card = document.createElement('div');
      card.className = `card rank-${player.rank}`;
      card.style.animationDelay = `${index * 0.05}s`;

      const guaranteeBadge = player.isGuaranteed ? `<div class="guarantee-tag">A以上確定</div>` : '';

      card.innerHTML = `
        ${guaranteeBadge}
        <div class="rank-badge">${player.rank}</div>
        <div><span class="pos-badge">${player.pos}</span></div>
        <div class="player-name">${player.name}</div>
        <div class="player-stat">総合力: ${player.power}</div>
      `;
      grid.appendChild(card);
    });
  }

  // オーダー画面の描画
  function renderOrderView() {
    const slotsContainer = document.getElementById('orderSlotsContainer');
    slotsContainer.innerHTML = '';

    let totalPower = 0;
    let filledCount = 0;

    ORDER_SLOTS.forEach(slot => {
      const assignedId = lineup[slot.key];
      const player = inventory.find(p => p.instanceId === assignedId);

      if (player) {
        totalPower += player.power;
        filledCount++;
      }

      const row = document.createElement('div');
      row.className = `slot-row ${selectedSlotKey === slot.key ? 'selected' : ''}`;
      row.onclick = () => {
        selectedSlotKey = slot.key;
        renderOrderView();
      };

      if (player) {
        row.innerHTML = `
          <div class="slot-label">${slot.label}</div>
          <div class="slot-player-info">
            <div>
              <span class="rank-pill pill-${player.rank}">${player.rank}</span>
              <strong>${player.name}</strong>
              <span style="font-size:0.8rem; color:#aaa;">(${player.pos})</span>
            </div>
            <div>
              <span style="color:#00ffcc; font-weight:bold;">${player.power}</span>
              <button class="remove-slot-btn" onclick="removeFromSlot(event, '${slot.key}')">外す</button>
            </div>
          </div>
        `;
      } else {
        row.innerHTML = `
          <div class="slot-label">${slot.label}</div>
          <div class="slot-player-info">
            <span class="empty-slot">--- 未設定 ---</span>
          </div>
        `;
      }
      slotsContainer.appendChild(row);
    });

    document.getElementById('teamPower').textContent = totalPower;
    document.getElementById('orderFilledCount').textContent = filledCount;
    document.getElementById('totalBoxCount').textContent = inventory.length;

    // 選択中スロットに応じた所持選手リスト描画
    const currentSlotDef = ORDER_SLOTS.find(s => s.key === selectedSlotKey);
    document.getElementById('slotFilterInfo').textContent =
      `選択中枠: 【${currentSlotDef.label}】 (適性: ${currentSlotDef.acceptPos.join(' / ')})`;

    const benchList = document.getElementById('benchList');
    benchList.innerHTML = '';

    // 適性一致を上に、その中で総合力順にソート
    const sortedPlayers = [...inventory].sort((a, b) => {
      const aFit = currentSlotDef.acceptPos.includes(a.pos) ? 1 : 0;
      const bFit = currentSlotDef.acceptPos.includes(b.pos) ? 1 : 0;
      if (aFit !== bFit) return bFit - aFit;
      return b.power - a.power;
    });

    if (sortedPlayers.length === 0) {
      benchList.innerHTML = '<div style="color:#888; padding:10px;">選手がいません。スカウトで獲得してください。</div>';
      return;
    }

    // オーダー入りしているbaseId一覧（同名選手重複防止用）
    const usedBaseIds = new Set();
    const usedInstanceIds = new Set();
    Object.values(lineup).forEach(instId => {
      if (instId) {
        usedInstanceIds.add(instId);
        const p = inventory.find(x => x.instanceId === instId);
        if (p) usedBaseIds.add(p.baseId);
      }
    });

    sortedPlayers.forEach(p => {
      const isFit = currentSlotDef.acceptPos.includes(p.pos);
      const isThisInstanceUsed = usedInstanceIds.has(p.instanceId);
      const isSameNameUsed = usedBaseIds.has(p.baseId);

      // 現在選択中スロットに入っている選手自身のbaseIdは除外して判定
      const currentSlotPlayer = inventory.find(x => x.instanceId === lineup[selectedSlotKey]);
      const isConflictName = isSameNameUsed && (!currentSlotPlayer || currentSlotPlayer.baseId !== p.baseId);

      const item = document.createElement('div');
      item.className = `bench-item ${!isFit ? 'mismatch' : ''} ${(isThisInstanceUsed || isConflictName) ? 'in-use' : ''}`;

      let statusTag = '';
      if (isThisInstanceUsed) statusTag = '<span class="in-use-tag">起用中</span>';
      else if (isConflictName) statusTag = '<span class="in-use-tag">同名起用中</span>';

      item.innerHTML = `
        <div>
          <span class="rank-pill pill-${p.rank}">${p.rank}</span>
          <strong>${p.name}</strong>
          <span style="font-size:0.8rem; color:#bbb;">[${p.pos}]</span>
          ${statusTag}
        </div>
        <div style="font-weight:bold; color:#00ffcc;">総合: ${p.power}</div>
      `;

      item.onclick = () => {
        if (!isFit) {
          alert(`この枠（${currentSlotDef.label}）には${p.pos}は配置できません。`);
          return;
        }
        if (isConflictName) {
          alert(`同じ選手（${p.name}）はオーダーに複数人入れられません。`);
          return;
        }
        // 他枠で起用中の同一カードなら元の枠から外す
        Object.keys(lineup).forEach(k => {
          if (lineup[k] === p.instanceId) lineup[k] = null;
        });
        lineup[selectedSlotKey] = p.instanceId;
        renderOrderView();
      };

      benchList.appendChild(item);
    });
  }

  // スロットから選手を外す
  function removeFromSlot(event, slotKey) {
    event.stopPropagation();
    lineup[slotKey] = null;
    renderOrderView();
  }

  // 最強オーダー自動編成
  function autoOrder() {
    // 一旦リセット
    Object.keys(lineup).forEach(k => lineup[k] = null);
    const usedBaseIds = new Set();

    // 総合力順にソートした所持選手リスト
    const sorted = [...inventory].sort((a, b) => b.power - a.power);

    // まずDH以外の固定ポジション(9枠)を埋める
    ORDER_SLOTS.filter(s => s.key !== 'DH').forEach(slot => {
      const candidate = sorted.find(p =>
        slot.acceptPos.includes(p.pos) && !usedBaseIds.has(p.baseId)
      );
      if (candidate) {
        lineup[slot.key] = candidate.instanceId;
        usedBaseIds.add(candidate.baseId);
      }
    });

    // 最後に残った野手から一番強い選手をDHに入れる
    const dhSlot = ORDER_SLOTS.find(s => s.key === 'DH');
    const dhCandidate = sorted.find(p =>
      dhSlot.acceptPos.includes(p.pos) && !usedBaseIds.has(p.baseId)
    );
    if (dhCandidate) {
      lineup['DH'] = dhCandidate.instanceId;
      usedBaseIds.add(dhCandidate.baseId);
    }

    renderOrderView();
  }

  // ヘッダーUI更新
  function updateHeaderUI() {
    document.getElementById('moneyDisplay').textContent = money;
    document.getElementById('btnSingle').disabled = money < COST_SINGLE;
    document.getElementById('btnMulti').disabled = money < COST_MULTI;

    let filled = 0;
    Object.values(lineup).forEach(v => { if (v) filled++; });
    document.getElementById('orderFilledCount').textContent = filled;
  }

  // リセット
  function resetData() {
    money = INITIAL_MONEY;
    inventory = [];
    Object.keys(lineup).forEach(k => lineup[k] = null);
    document.getElementById('cardsGrid').innerHTML = '';
    document.getElementById('resultTitle').textContent = 'スカウトボタンを押して選手を獲得しよう！';
    updateHeaderUI();
    renderOrderView();
  }

  updateHeaderUI();
</script>
